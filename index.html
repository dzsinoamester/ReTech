<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <title>ReTech - Main page</title>
</head>

<body>
    <div class="container-fluid bg">

        <!-- Menu -->
        <nav class="navbar sm:navbar-expand bg-1 fg-2">
            <div class="center">
                <img src="/assets/img/logo_withoutbg_blacktext.png" alt="Logó" title="Logó" class="logo pb-5">
                <hr class="new1">
            </div>

            <div class="container-fluid">
                <a class="navbar-brand" href="index.html"></a>
                <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer"
                    data-bs-target="#navbarNav" aria-controls="navbarNav" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon" aria-hidden="true"></span>
                </button>
                <dialog class="drawer drawer-end" id="navbarNav" aria-labelledby="navbarNavLabel">
                    <div class="drawer-header">
                        <h5 class="drawer-title" id="navbarNavLabel">Menu</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
                    </div>
                    <div class="drawer-body   center pt-2">
                        <ul class="navbar-nav">
                            <li class="nav-item">
                                <a class="nav-link active" aria-current="page" href="/index.html">Home</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="/products.html">Products</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="/trade-in.html">Trade in</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="/contact.html">Contact</a>
                            </li>
                        </ul>
                    </div>
                </dialog>
            </div>
        </nav>


        <!-- Hero -->
        <div id="carouselExampleDark" class="carousel carousel-overlay slide" data-bs-theme="dark">
            <div class="carousel-inner">
                <div class="carousel-item active" data-bs-interval="10000">
                    <img src="/assets/img/product1.png" class="d-block w-100 rounded-5" alt="...">
                </div>
                <div class="carousel-item" data-bs-interval="2000">
                    <img src="/assets/img/product2.png" class="d-block w-100 rounded-5" alt="...">
                </div>
                <div class="carousel-item">
                    <img src="/assets/img/product3.png" class="d-block w-100 rounded-5" alt="...">
                </div>
            </div>
            <div class="carousel-overlay-controls">
                <button class="btn-icon btn-sm btn-subtle theme-secondary" type="button"
                    data-bs-target="#carouselExampleDark" data-bs-slide="prev">
                    <span class="carousel-icon-prev" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <div class="carousel-indicators">
                    <button type="button" data-bs-target="#carouselExampleDark" data-bs-slide-to="0" class="active mb-5"
                        aria-current="true" aria-label="Slide 1"></button>
                    <button type="button" data-bs-target="#carouselExampleDark" data-bs-slide-to="1" class=" mb-5"
                        aria-label="Slide 2"></button>
                    <button type="button" data-bs-target="#carouselExampleDark" data-bs-slide-to="2" class=" mb-5"
                        aria-label="Slide 3"></button>
                </div>
                <button class="btn-icon btn-sm btn-subtle theme-secondary" type="button"
                    data-bs-target="#carouselExampleDark" data-bs-slide="next">
                    <span class="carousel-icon-next" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>
        </div>
    </div>



    <footer class="bg-black fg-white pt-10 pb-8">
        <div class="container">

            <!-- Top Section: 3 Equal Columns (12 / 4 = 3 columns) -->
            <div class="row gy-6 pb-8">

                <!-- Column 1: Logo & Slogan -->
                <div class="col-12 lg:col-4">
                    <h4 class="fw-bold text-uppercase mb-1">LOGO</h4>
                    <p class="fs-xs text-uppercase fg-3 mb-0">SLOGAN COMPANY</p>
                </div>

                <!-- Column 2: Navigation Links 1 -->
                <div class="col-12 lg:col-4">
                    <ul class="list-unstyled text-uppercase fs-xs fw-semibold d-flex flex-column gap-2 mb-0">
                        <li><a href="#" class="fg-white text-decoration-none">Services</a></li>
                        <li><a href="#" class="fg-white text-decoration-none">Showcase</a></li>
                        <li><a href="#" class="fg-white text-decoration-none">Support</a></li>
                    </ul>
                </div>

                <!-- Column 3: Navigation Links 2 -->
                <div class="col-12 lg:col-4">
                    <ul class="list-unstyled text-uppercase fs-xs fw-semibold d-flex flex-column gap-2 mb-0">
                        <li><a href="#" class="fg-white text-decoration-none">About Us</a></li>
                        <li><a href="#" class="fg-white text-decoration-none">Contact Us</a></li>
                        <li><a href="#" class="fg-white text-decoration-none">Affiliates</a></li>
                        <li><a href="#" class="fg-white text-decoration-none">Resources</a></li>
                    </ul>
                </div>

            </div>

            <!-- Middle Horizontal Divider -->
            <hr class="border-secondary opacity-50 my-6">

            <!-- Bottom Section: Social Icons & Copyright -->
            <div class="text-center pt-2">
                <div class="d-flex justify-content-center gap-3 mb-4">
                    <a href="#" class="btn btn-outline rounded-circle fg-white border-secondary"
                        aria-label="Facebook">f</a>
                    <a href="#" class="btn btn-outline rounded-circle fg-white border-secondary"
                        aria-label="Twitter">t</a>
                    <a href="#" class="btn btn-outline rounded-circle fg-white border-secondary"
                        aria-label="Instagram">in</a>
                </div>
                <p class="fs-xs fg-3 mb-0">&copy; Copyright. All rights reserved.</p>
            </div>

        </div>
    </footer>


    <script src="js/script.js"></script>
    <script type="module"
        src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
